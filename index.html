<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Essência & Vida — Loja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Jost:wght@300;400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topnav">
  <div class="brand"><div class="mark"></div>Essência & Vida</div>

    <span class="adminDot" title="admin" onclick="goTo('admin')"></span>

</header>

<main id="mainView"></main>

<footer class="siteFooter">
  <div class="footGrid">
    <div class="col">
      <b>Fale com a gente</b>
      <div id="footPhone">📞 —</div>
      <div id="footEmail">✉️ —</div>
    </div>
    <div class="col">
      <b>Pagamento</b>
      <div>Pix • Dinheiro na entrega (combinado via WhatsApp)</div>
    </div>
    <div class="col">
      <b>Essência & Vida</b>
      <div style="opacity:.55">Produtos selecionados, entrega combinada, atendimento direto.</div>
    </div>
  </div>
</footer>

<div class="radioBar">
  <span class="label">Rádio</span>
  <select id="radioSelect"></select>
  <button class="playPause" id="playPauseBtn">▶</button>
  <span class="status" id="radioStatus">parado</span>
  <audio id="radioAudio" preload="none"></audio>
</div>

<div id="modalRoot"></div>

<script type="module" src="js/app.js"></script>
